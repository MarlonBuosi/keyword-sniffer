name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" on main = manual redeploy

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; on main a newer run must not kill a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check on main, and the deploy gate; keep the name.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the server
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploys main to EC2 via AWS SSM, only after `quality` passes. GitHub logs in
  # to AWS with OIDC (no stored keys); the IAM role may only run the
  # `wa-monitor-deploy` SSM document on this one instance. Setup: deploy/AWS.md §7.
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false # never interrupt a deploy midway
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      - run: deploy/ssm-deploy.sh "${{ vars.EC2_INSTANCE_ID }}" "$GITHUB_SHA"
