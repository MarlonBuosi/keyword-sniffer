name: CI # deploy.yml triggers on this name: keep them in sync

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" on main = manual redeploy (via deploy.yml)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; every main run must finish so it can deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is a separate required status check on main (branch protection
# lists them by name): renaming or adding one means updating it too. When the
# whole run succeeds on main, deploy.yml ships the commit.
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm audit signatures
      # Warn only: a fresh upstream advisory must not block merges and deploys.
      - name: npm audit (warn only)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::high/critical advisories in production dependencies, see the deps job log"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx biome ci

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build

  # The deploy scripts run as root on the server. ShellCheck is preinstalled
  # on ubuntu-latest, and new *.sh files are picked up automatically.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
